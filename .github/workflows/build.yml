name: Build Xiaomi 6 MIUI14 SukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 配置编译环境与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5 libncurses5-dev libncurses-dev libssl-dev bc bison flex libelf-dev zip curl git ccache

      - name: 获取内核源码与交叉编译链
        run: |
          # 克隆支持小米6的 4.4 CAF 内核源码树
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b sagit-p-oss kernel
          cd kernel

          # 下载 Google prebuilts GCC 4.9 交叉编译器
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm32

      - name: 集成 SukiSU-Ultra 驱动
        run: |
          cd kernel
          # 直接拉取 SukiSU-Ultra 驱动源码到 drivers/kernelsu
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU-Ultra.git drivers/kernelsu || git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu

          # 配置 KSU 驱动构建入口
          if ! grep -q "CONFIG_KSU" drivers/Makefile; then
              echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          fi
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: 应用导出的 config 并修复模块签名
        run: |
          cd kernel
          # 将你上传到仓库根目录的 sagit_defconfig 覆盖作为目标配置
          cp ../sagit_defconfig arch/arm64/configs/sagit_user_defconfig

          # 强制关闭模块强签名校验，防止 Wi-Fi/声音模块失效
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --disable CONFIG_MODULE_SIG_ALL
          
          # 启用 KSU 配置
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --enable CONFIG_KSU
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --enable CONFIG_KSU_SUSFS

      - name: 执行编译
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/gcc-arm64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc-arm32/bin/arm-linux-androideabi-

          make sagit_user_defconfig
          make -j$(nproc) Image.gz-dtb modules

      - name: 打包 AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel/arch/arm64/boot/Image.gz-dtb AK3/
          
          # 收集生成的驱动模块，防止签名改变导致外部模块不加载
          mkdir -p AK3/modules/system/lib/modules/
          find kernel/ -name "*.ko" -exec cp {} AK3/modules/system/lib/modules/ \; 2>/dev/null || true
          
          cd AK3
          # 配置 AnyKernel 匹配 sagit 设备
          sed -i 's/device.name1=.*/device.name1=sagit/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=MI6/' anykernel.sh
          zip -r9 ../Xiaomi6-MIUI14-SukiSU.zip * -x .git README.md

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi6-MIUI14-SukiSU
          path: Xiaomi6-MIUI14-SukiSU.zip
