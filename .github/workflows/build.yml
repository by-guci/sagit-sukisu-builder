name: Build Xiaomi 6 MIUI14 SukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 安装系统构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5 libncurses5-dev \
            libssl-dev \
            bc bison flex libelf-dev zip curl git ccache \
            python2 python-is-python3 xz-utils wget

          if ! which python2 >/dev/null; then
              sudo ln -sf $(which python3) /usr/bin/python2
          fi

      - name: 下载 64 位原生独立 GCC 4.9 交叉编译器
        run: |
          # 使用来自官方镜像的纯 64 位原生 ELF 编译器，绝不缺库、绝无 command not found
          mkdir -p toolchains
          cd toolchains
          
          # 下载 AArch64 GCC 4.9
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          mv gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu gcc-arm64

          # 下载 ARM32 GCC 4.9
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz
          mv gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi gcc-arm32

      - name: 获取内核源码并拆除高通 Warning 阻断暗桩
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b sagit-p-oss kernel
          cd kernel

          # 修复宿主机 GCC 11 编译旧版 DTC yylloc 符号冲突
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true

          # 拆除高通特有的 forbidden warning 检查逻辑
          if [ -f scripts/checkforwarnings.sh ]; then
              echo "#!/bin/sh" > scripts/checkforwarnings.sh
              echo "exit 0" >> scripts/checkforwarnings.sh
          fi
          sed -i 's/error, forbidden warning/warning/g' scripts/Makefile.build 2>/dev/null || true

      - name: 挂载 SukiSU 驱动目录
        run: |
          cd kernel
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU_SRC
          ln -s $(pwd)/KernelSU_SRC/kernel $(pwd)/drivers/kernelsu

          if ! grep -q "CONFIG_KSU" drivers/Makefile; then
              echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          fi
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: 载入配置并关闭签名校验与 Warning 报错
        run: |
          cd kernel
          cp ../sagit_defconfig arch/arm64/configs/sagit_user_defconfig

          # 关闭签名强校验（避免 Wi-Fi/声音模块变灰）
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --disable CONFIG_MODULE_SIG_ALL
          
          # 关闭警告当错误中断
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --disable CONFIG_ERROR_ON_WARNING
          
          # 启用 KSU 配置
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --enable CONFIG_KSU

      - name: 执行内核编译
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/gcc-arm64/bin:${GITHUB_WORKSPACE}/toolchains/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCFLAGS="-fcommon"

          # 打印验证真实编译器版本
          aarch64-linux-gnu-gcc -v

          cd kernel
          make sagit_user_defconfig
          make -j$(nproc) HOSTCFLAGS="-fcommon" Image.gz-dtb modules

      - name: 打包刷机卡刷包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel/arch/arm64/boot/Image.gz-dtb AK3/
          
          mkdir -p AK3/modules/system/lib/modules/
          find kernel/ -name "*.ko" -exec cp {} AK3/modules/system/lib/modules/ \; 2>/dev/null || true
          
          cd AK3
          sed -i 's/device.name1=.*/device.name1=sagit/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=MI6/' anykernel.sh
          zip -r9 ../Xiaomi6-MIUI14-SukiSU.zip * -x .git README.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi6-MIUI14-SukiSU
          path: Xiaomi6-MIUI14-SukiSU.zip
