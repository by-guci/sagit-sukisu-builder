name: Build Xiaomi 6 MIUI14 SukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            bc \
            bison \
            flex \
            libelf-dev \
            zip \
            curl \
            git \
            python2 \
            python-is-python3

          if ! which python2 >/dev/null; then
              sudo ln -sf $(which python3) /usr/bin/python2
          fi

      - name: 获取 Proton-Clang 工具链与小米6内核源码
        run: |
          # 使用免依赖的 Proton Clang（自带 binutils 与兼容运行时）
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          
          # 克隆小米6官方开源分支
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b sagit-p-oss kernel
          cd kernel

          # 修复 GCC/Host 工具编译旧版 DTC 重复定义
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true

      - name: 挂载 SukiSU 驱动目录
        run: |
          cd kernel
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU_SRC
          ln -s $(pwd)/KernelSU_SRC/kernel $(pwd)/drivers/kernelsu

          if ! grep -q "CONFIG_KSU" drivers/Makefile; then
              echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          fi
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: 配置内核并彻底关闭签名校验与 Warning 阻断
        run: |
          cd kernel
          cp ../sagit_defconfig arch/arm64/configs/sagit_user_defconfig

          # 禁用模块签名校验
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --disable CONFIG_MODULE_SIG_ALL
          
          # 启用 KSU 配置
          scripts/config --file arch/arm64/configs/sagit_user_defconfig --enable CONFIG_KSU

      - name: 执行内核编译
        run: |
          # 引入 Proton Clang 工具链
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          cd kernel
          make sagit_user_defconfig
          
          # KCFLAGS 注入禁止把 Warning 当作 Error 停止编译的开关
          make -j$(nproc) \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error -Wno-array-bounds" \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            Image.gz-dtb modules

      - name: 打包卡刷包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel/arch/arm64/boot/Image.gz-dtb AK3/
          
          mkdir -p AK3/modules/system/lib/modules/
          find kernel/ -name "*.ko" -exec cp {} AK3/modules/system/lib/modules/ \; 2>/dev/null || true
          
          cd AK3
          sed -i 's/device.name1=.*/device.name1=sagit/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=MI6/' anykernel.sh
          zip -r9 ../Xiaomi6-MIUI14-SukiSU.zip * -x .git README.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi6-MIUI14-SukiSU
          path: Xiaomi6-MIUI14-SukiSU.zip
